app-id: io.github.hasanmuammar.ShantiFilesystemProbe
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: shanti-filesystem-permission-probe

# Disposable proof of concept only. These grants do NOT expose the real
# installation directories and must not be reused as a production manifest.
finish-args:
  - --filesystem=~/.local/shanti-flatpak-permission-probe:create
  - --filesystem=xdg-data/shanti-flatpak-permission-probe:create
  - --filesystem=xdg-config/shanti-flatpak-permission-probe:create
  - --filesystem=xdg-cache/shanti-flatpak-permission-probe:create

modules:
  - name: filesystem-permission-probe
    buildsystem: simple
    build-commands:
      - install -Dm755 filesystem-permission-probe.sh /app/bin/shanti-filesystem-permission-probe
    sources:
      - type: file
        path: filesystem-permission-probe.sh
