name: Prebuilt package test

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  workflow_dispatch:

jobs:
  package-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            backend: ibus
          - runner: ubuntu-24.04
            arch: x86_64
            backend: fcitx
          - runner: ubuntu-24.04-arm
            arch: aarch64
            backend: ibus
          - runner: ubuntu-24.04-arm
            arch: aarch64
            backend: fcitx

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y             build-essential             cmake             ninja-build             pkg-config             rustc             cargo             libzstd-dev             qtbase5-dev             qtbase5-dev-tools             libqt5svg5-dev             libibus-1.0-dev             libfcitx5core-dev             ca-certificates

      - name: Check shell syntax
        run: |
          bash -n tools/portable/common.sh
          bash -n tools/portable/build.sh
          bash -n tools/portable/bundle-runtime.sh
          bash -n tools/portable/environment.sh
          bash -n tools/portable/install.sh
          bash -n tools/portable/package.sh
          bash -n tools/install.sh
          bash -n tools/uninstall.sh

      - name: Build prebuilt package
        env:
          OPENBANGLA_BUILD_USE_HOST: "1"
          OPENBANGLA_NONINTERACTIVE: "1"
        run: bash tools/build.sh --backend ${{ matrix.backend }} --package

      - name: Validate package
        env:
          BACKEND: ${{ matrix.backend }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -Eeuo pipefail

          archive="dist/openbangla-keyboard_linux_${ARCH}_${BACKEND}.tar.gz"
          checksum="${archive}.sha256"

          test -f "$archive"
          test -f "$checksum"
          (
            cd dist
            sha256sum -c "$(basename "$checksum")"
          )

          work="$(mktemp -d)"
          install_home="$(mktemp -d)"
          # GitHub-hosted runners are disposable; leave these temporary paths
          # for runner teardown rather than issuing an automatic recursive delete.
          tar -xzf "$archive" -C "$work"

          test -x "$work/bin/openbangla-gui"
          test -f "$work/share/applications/openbangla-keyboard.desktop"
          grep -Fq 'Exec="@OBK_PREFIX@/bin/openbangla-gui" %f' "$work/share/applications/openbangla-keyboard.desktop"
          ! grep -Fq '/home/runner/' "$work/share/applications/openbangla-keyboard.desktop"
          test -d "$work/lib/openbangla"
          test -d "$work/share/openbangla-keyboard"
          test -f "$work/share/openbangla-keyboard/layouts/avrophonetic.json"
          test -f "$work/share/openbangla-keyboard/data/autocorrect.json"
          test -f "$work/share/openbangla-keyboard/data/dictionary.json"
          test -f "$work/share/openbangla-keyboard/data/suffix.json"
          test -f "$work/share/openbangla-keyboard/data/regex.json"

          if [[ "$BACKEND" == ibus ]]; then
            test -x "$work/libexec/ibus-engine-openbangla"
            test -f "$work/share/ibus/component/openbangla.xml"
            grep -Fq '<exec>@OBK_PREFIX@/libexec/ibus-engine-openbangla --ibus</exec>' "$work/share/ibus/component/openbangla.xml"
            grep -Fq '<icon>@OBK_DATA_HOME@/openbangla-keyboard/icons/OpenBangla-Keyboard.png</icon>' "$work/share/ibus/component/openbangla.xml"
            ! grep -Fq '/home/runner/' "$work/share/ibus/component/openbangla.xml"
          else
            test -f "$work/share/fcitx5/addon/openbangla.conf"
          fi

          QT_QPA_PLATFORM=offscreen "$work/bin/openbangla-gui" --version
          QT_QPA_PLATFORM=offscreen "$work/bin/openbangla-gui" --check-data

          # Simulate installation with a non-default absolute XDG_DATA_HOME.
          install_prefix="$install_home/.local"
          install_data_home="$work/custom-xdg-data"
          install_config_home="$work/custom-xdg-config"
          mkdir -p "$install_prefix" "$install_data_home" "$install_config_home"
          tar -xzf "$archive" -C "$install_prefix"

          HOME="$install_home" \
          XDG_DATA_HOME="$install_data_home" \
          XDG_CONFIG_HOME="$install_config_home" \
          OBK_PREFIX="$install_prefix" \
          OBK_DATA_HOME="$install_data_home" \
          OBK_BACKEND="$BACKEND" \
          bash -c '
            set -Eeuo pipefail
            source tools/portable/common.sh
            source tools/portable/install.sh
            install_xdg_resources
            rewrite_install_metadata

            test -f "$OBK_DATA_HOME/openbangla-keyboard/data/dictionary.json"
            # The installer must preserve source files instead of silently deleting them.
            test -f "$OBK_PREFIX/share/openbangla-keyboard/data/dictionary.json"
            test -f "$OBK_DATA_HOME/applications/openbangla-keyboard.desktop"
            grep -Fq "Exec=\"$OBK_PREFIX/bin/openbangla-gui\" %f" \
              "$OBK_DATA_HOME/applications/openbangla-keyboard.desktop"

            QT_QPA_PLATFORM=offscreen "$OBK_PREFIX/bin/openbangla-gui" --check-data

            if [[ "$OBK_BACKEND" == ibus ]]; then
              grep -Fq "<exec>\"$OBK_PREFIX/libexec/ibus-engine-openbangla\" --ibus</exec>" \
                "$OBK_DATA_HOME/ibus/component/openbangla.xml"
              grep -Fq "<icon>$OBK_DATA_HOME/openbangla-keyboard/icons/OpenBangla-Keyboard.png</icon>" \
                "$OBK_DATA_HOME/ibus/component/openbangla.xml"
            else
              test -f "$OBK_DATA_HOME/fcitx5/addon/openbangla.conf"
              test -f "$OBK_DATA_HOME/fcitx5/inputmethod/openbangla.conf"
            fi
          '

      - name: Upload prebuilt package
        uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.arch }}-${{ matrix.backend }}-package
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
