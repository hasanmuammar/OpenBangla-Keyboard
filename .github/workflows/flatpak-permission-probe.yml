name: Flatpak filesystem permission probe

on:
  push:
    branches:
      - experiment/flatpak-ibus
    paths:
      - tools/flatpak/permission-probe.yml
      - tools/flatpak/filesystem-permission-probe.sh
      - tools/flatpak/README.md
      - .github/workflows/flatpak-permission-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem-permissions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub for this user
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime and SDK
        run: |
          flatpak install --user --assumeyes flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

      - name: Build and install the disposable probe
        run: |
          flatpak-builder --user --install --force-clean /tmp/shanti-fs-probe-build tools/flatpak/permission-probe.yml

      - name: Test filesystem grants inside the Flatpak sandbox
        run: |
          flatpak run io.github.hasanmuammar.ShantiFilesystemProbe
