name: Linux release

on:
  push:
    tags:
      - "shanti-alpha.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: ibus
            arch: x86_64
            runner: ubuntu-22.04
          - backend: fcitx
            arch: x86_64
            runner: ubuntu-22.04
          - backend: ibus
            arch: aarch64
            runner: ubuntu-22.04-arm
          - backend: fcitx
            arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            rustc \
            cargo \
            libzstd-dev \
            qtbase5-dev \
            qtbase5-dev-tools \
            libqt5svg5-dev \
            libibus-1.0-dev \
            libfcitx5core-dev \
            ca-certificates

      - name: Build release archive
        env:
          OPENBANGLA_BUILD_USE_HOST: "1"
          OPENBANGLA_NONINTERACTIVE: "1"
        run: bash tools/build.sh --backend ${{ matrix.backend }} --package

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.arch }}-${{ matrix.backend }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "OpenBangla Keyboard ${GITHUB_REF_NAME}" \
            --prerelease \
            --generate-notes

      - name: Upload Linux releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*
